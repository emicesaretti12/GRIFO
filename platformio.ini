; ─────────────────────────────────────────────────────────────────────────────
; Grifo de cerveza automatizado — ESP32 + RFID + caudalímetro + Supabase
;
; Un ENTORNO (env) por etapa. Cada etapa es un sketch independiente que prueba
; UNA sola pieza de hardware, así cuando algo no anda sabemos exactamente qué
; falla. Es la misma idea que tener un test por módulo en vez de un test
; gigante que toca todo.
;
;   pio run -e etapa1_blink -t upload     -> compila y flashea SOLO la etapa 1
;   pio device monitor -b 115200          -> abre el monitor serial
;
; A medida que avancemos se agrega un [env:etapaN_xxx] nuevo acá abajo y una
; carpeta src/etapaN_xxx/. Los envs viejos siguen funcionando: podés volver a
; flashear la etapa 2 en cualquier momento para re-testear el lector RFID solo.
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
; Qué se compila cuando corrés `pio run` sin aclarar el env.
default_envs = etapa1_blink

; Config común a todas las etapas. Los [env:...] de abajo la heredan.
[env]
platform = espressif32
board = esp32dev                ; ESP32 Dev Module — sirve para el NodeMCU ESP-WROOM-32S de 38 pines
framework = arduino
monitor_speed = 115200

; Velocidad de FLASHEO (distinta de la del monitor).
; El default de esptool es 460800: se conecta a 115200 y despues negocia
; subir a 460800 para escribir mas rapido. Con este conversor CP2102 el
; enlace no aguanta esa velocidad y el flasheo muere justo despues del
; "Changing baud rate to 460800 / Changed." con:
;     A fatal error occurred: Unable to verify flash chip connection
;                             (No serial data received.)
; 115200 es ~4x mas lento escribiendo, pero es confiable. Para un firmware
; de este tamano la diferencia son segundos, asi que no se toca.
upload_speed = 115200

; Filtro del monitor serial: si la placa crashea, traduce el volcado de
; registros a nombres de función y número de línea. Es, literalmente, el
; stack trace. (No usamos el filtro "time" porque ya imprimimos millis()
; nosotros y quedaría duplicado.)
monitor_filters = esp32_exception_decoder


; ── Etapa 1 — Blink ──────────────────────────────────────────────────────────
; Confirma toolchain, driver CP2102 y que podemos flashear. Solo cable USB.
[env:etapa1_blink]
build_src_filter = -<*> +<etapa1_blink/>


; ── Etapa 2 — Lector RFID solo ───────────────────────────────────────────────
; Solo el MFRC522 por SPI (VSPI). Sin relé, sin caudalímetro, sin WiFi.
; El módulo se alimenta con 3.3V. Con 5V se quema.
[env:etapa2_rfid]
build_src_filter = -<*> +<etapa2_rfid/>
lib_deps = miguelbalboa/MFRC522@^1.4.11
